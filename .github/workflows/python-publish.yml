# Publish to PyPI only after CI has passed the exact commit being published.
#
# Previously this ran on `push` to main, which meant code reached users before
# (or without) any CI run: the upstream auto-merge pushes with GITHUB_TOKEN,
# and such pushes never trigger push workflows. Waiting on `workflow_run`
# closes that hole: nothing ships unless a CI run on that commit succeeded.
#
# The "Check if version exists" step keeps this idempotent — a version already
# on PyPI is skipped cleanly, so repeated CI successes do not re-publish.

name: Publish to PyPI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # trusted publishing to PyPI
      attestations: write    # build provenance for the published files
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/desloppify

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify the commit is on main
        run: |
          sha=$(git rev-parse HEAD)
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; refusing to publish"
            exit 1
          fi
          echo "Publishing $sha (on main)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version exists on PyPI
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/desloppify/${{ steps.version.outputs.version }}/json")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} already on PyPI — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.version }} not on PyPI — will publish."
          fi

      - name: Run binary and blob gate
        if: steps.check.outputs.exists == 'false'
        run: make scan-blobs

      - name: Run packaging smoke gate
        if: steps.check.outputs.exists == 'false'
        run: make package-smoke

      - name: Attest build provenance
        if: steps.check.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
