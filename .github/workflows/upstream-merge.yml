name: Auto-merge upstream PRs

# Merges new open pull requests from the upstream repo
# (https://github.com/peteromallet/desloppify) into this fork's main branch.
#
# Behavior matches the fork's existing manual history:
#   - Every open upstream PR (drafts included) whose head commit is not yet
#     reachable from main is merged with commit message "Merge upstream PR #NNN".
#   - On conflicts the fork's already-integrated version wins
#     ("resolved conflicts using ours"), exactly like the manual merges.
#
# No secrets required: the upstream repo is public (plain curl for the PR list,
# plain git fetch for PR heads) and pushes use the repo-scoped GITHUB_TOKEN.

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream PR heads
        run: |
          git remote add upstream https://github.com/peteromallet/desloppify.git
          git fetch upstream '+refs/pull/*/head:refs/remotes/upstream-pr/*'

      - name: Determine pending PRs
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, urllib.request

          API = "https://api.github.com/repos/peteromallet/desloppify/pulls"

          def fetch(page):
              request = urllib.request.Request(
                  f"{API}?state=open&per_page=100&page={page}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "User-Agent": "desloppify-upstream-merge",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          # Upstream has more than one page of open pull requests; reading only
          # page 1 silently ignored PRs past the hundredth.
          prs = []
          for page in range(1, 11):
              batch = fetch(page)
              if not isinstance(batch, list):
                  raise SystemExit(f"Unexpected API response: {str(batch)[:200]}")
              prs.extend(batch)
              if len(batch) < 100:
                  break

          pending = []
          for pr in prs:
              num, sha = pr["number"], pr["head"]["sha"]
              r = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, "refs/remotes/origin/main"],
                  capture_output=True,
              )
              if r.returncode != 0:
                  pending.append((num, sha))

          pending.sort()  # ascending PR number, matches manual history
          with open("/tmp/pending.txt", "w") as f:
              for num, sha in pending:
                  f.write(f"{num} {sha}\n")
          meta = {
              str(pr["number"]): {
                  "author": (pr.get("user") or {}).get("login"),
                  "title": pr.get("title"),
              }
              for pr in prs
          }
          json.dump(meta, open("/tmp/pr_meta.json", "w"))
          print(f"{len(prs)} open upstream PR(s), {len(pending)} to merge")
          for num, _ in pending:
              print(f"  PR #{num}")
          EOF
          echo "count=$(wc -l < /tmp/pending.txt)" >> "$GITHUB_OUTPUT"

      # Holds back anything that touches install/build/publish machinery, moves a
      # dependency source, or is too large to have been read. A gate crash fails
      # the run instead of being mistaken for a clean result.
      - name: Classify pending PRs
        if: steps.pending.outputs.count != '0'
        run: |
          python3 .github/scripts/triage_pending.py \
            --base "$(git rev-parse refs/remotes/origin/main)" \
            --pending /tmp/pending.txt \
            --meta /tmp/pr_meta.json \
            --admitted /tmp/admitted.txt \
            --summary /tmp/merge-summary.md
          cat /tmp/merge-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Merge admitted PRs
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merged=0
          if [ -f /tmp/admitted.txt ] && [ -s /tmp/admitted.txt ]; then
            while read -r num sha; do
              msg="Merge upstream PR #${num}"
              if git merge --no-edit -m "$msg" "$sha" 2>/dev/null; then
                echo "Merged PR #${num} (clean)"
              else
                git merge --abort
                git merge -X ours --no-edit -m "$msg (resolved conflicts using ours)" "$sha"
                echo "Merged PR #${num} (conflicts resolved using ours)"
              fi
              merged=$((merged + 1))
            done < /tmp/admitted.txt
          fi
          merged=${merged:-0}
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          if [ "$merged" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Re-scan the merged tree: the per-PR scan compares each head against the
      # pre-merge main, this catches anything the merges themselves introduce.
      - name: Verify merged tree
        if: steps.merge.outputs.changed == 'true'
        run: python3 .github/scripts/scan_blobs.py --all

      - name: Push to main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      # A push made with GITHUB_TOKEN does not trigger ci.yml, so ask for a run
      # explicitly. workflow_dispatch is the one event GITHUB_TOKEN may raise.
      - name: Trigger CI on main
        if: steps.merge.outputs.changed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched CI for main"